name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # bouton pour relancer à la main depuis GitHub

jobs:

  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Construire la documentation Sphinx
        run: uv run --locked sphinx-build -b html -W --keep-going docs docs/_build/html
      - name: Conserver la documentation HTML générée
        uses: actions/upload-artifact@v7
        with:
          name: railinsight-sphinx-html
          path: docs/_build/html/
          if-no-files-found: error
          retention-days: 90

  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Installer les dépendances
        run: uv sync --locked

      - name: Lancer les tests et mesurer la couverture
        run: uv run --locked pytest -v --cov=src --cov-report=term-missing --cov-fail-under=90
